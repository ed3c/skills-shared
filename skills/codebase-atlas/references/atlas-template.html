<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Codebase Atlas</title>
<style>
:root{--paper:#cdc499;--paper2:#d8cfaa;--ink:#1b1506;--muted:#756e4f;--rule:rgba(27,21,6,.78);--grid:rgba(27,21,6,.105);--topbar:52px;--rail:clamp(178px,10.06vw,206px);--inspector:clamp(372px,21.53vw,441px)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}body{display:grid;grid-template-rows:var(--topbar) 1fr}.top{border-bottom:1px solid var(--rule);display:flex;align-items:stretch}.meta{display:flex;flex:1}.cell{min-width:170px;padding:7px 12px;border-right:1px solid var(--rule)}.lab{font-size:9px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.val{font-size:13px;margin-top:3px}.actions{display:flex;align-items:center;gap:7px;padding:0 10px}.actions button,.tabs button,.zoom button{font:inherit;font-size:10px;letter-spacing:.08em;background:transparent;border:1px solid var(--rule);color:var(--ink);padding:7px 10px;border-radius:0}.shell{display:grid;grid-template-columns:var(--rail) 1fr var(--inspector);min-height:0}.rail,.inspector{overflow:auto}.rail{border-right:1px solid var(--rule);padding:14px 10px}.inspector{border-left:1px solid var(--rule)}.eyebrow{font-size:9px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase}.rail h1{font-size:16px;font-weight:400;margin:10px 0 7px}.rail p{font-size:10px;line-height:1.5;margin:0 0 16px}.group{font-size:9px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:14px 0 6px}.row{border:1px solid var(--rule);padding:9px 8px;margin:4px 0;font-size:10px;display:grid;grid-template-columns:24px 1fr 32px;gap:4px;cursor:pointer}.row.active{background:var(--ink);color:var(--paper2)}.stage{position:relative;overflow:hidden}.stage svg{width:100%;height:100%;display:block}.zoom{position:absolute;right:8px;top:8px;display:grid;gap:4px}.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--rule)}.tabs button{border:0;border-right:1px solid var(--rule);padding:12px}.tabs button.active{background:var(--ink);color:var(--paper2)}.panel{padding:18px}.panel h2{font-size:20px;font-weight:400;margin:9px 0}.panel .sub{font-size:10px;color:var(--muted);margin-bottom:16px}.section{border-top:1px solid var(--rule);padding-top:10px;margin-top:16px}.section h3{font-size:9px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;font-weight:400}.section p{font-size:11px;line-height:1.55}.trace{border:1px solid var(--rule);padding:10px;margin-top:14px}.trace div{font-size:10px;padding:3px 0;color:var(--muted)}.trace .active{color:var(--ink);font-weight:700}.hint{position:absolute;left:10px;bottom:8px;font-size:9px;letter-spacing:.12em;color:var(--muted)}.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper2);padding:7px 9px;font-size:10px;display:none;max-width:260px;z-index:5}@media(max-width:900px){.shell{grid-template-columns:160px 1fr}.inspector{position:absolute;right:0;top:var(--topbar);bottom:0;width:min(78vw,420px);background:var(--paper);z-index:7}.cell{min-width:130px}.meta .cell:nth-child(n+3){display:none}}
</style>
</head>
<body>
<div class="top"><div class="meta" id="meta"></div><div class="actions"><button id="flowBtn">RESUME FLOW</button><button id="traceBtn">TRACE ONE STEP</button><button id="resetBtn">RESET VIEW</button></div></div>
<div class="shell"><aside class="rail"><div class="eyebrow">THE SYSTEM</div><h1 id="sysTitle">Codebase Atlas</h1><p id="sysDesc"></p><div id="groups"></div></aside><main class="stage" id="stage"><svg id="map" viewBox="0 0 1200 850" aria-label="isometric codebase map"></svg><div class="zoom"><button id="plus">+</button><button id="minus">−</button></div><div class="hint">DRAG TO PAN · SCROLL TO ZOOM · HOVER TO READ</div><div class="tip" id="tip"></div></main><aside class="inspector"><div class="tabs"><button class="active" data-tab="what">WHAT IT DOES</button><button data-tab="how">HOW IT'S BUILT</button></div><div class="panel" id="panel"></div></aside></div>
<script>
// Replace only ATLAS_DATA for consumer runs.
const ATLAS_DATA={meta:[{label:'REPOSITORY',value:'sample / replace-me'},{label:'SERVICES',value:'not measured'},{label:'RUNTIMES',value:'not measured'},{label:'LIVE PATH',value:'not measured'}],overview:{title:'Codebase Atlas',subtitle:'Repository architecture map',what:'Replace ATLAS_DATA with measured repository facts.',how:'Single-file HTML with an isometric SVG renderer.'},groups:[{id:'core',name:'THE REQUEST PATH',rowIds:['web','core','store']}],structures:[{id:'web',code:'WB',name:'Web Client',group:'core',gx:2,gy:2,w:2,d:1,h:2,what:'Entry surface.',how:'Replace with repository evidence.',talks:['core']},{id:'core',code:'CR',name:'Core Domain',group:'core',gx:6,gy:4,w:3,d:2,h:4,what:'Main domain logic.',how:'Replace with repository evidence.',talks:['store']},{id:'store',code:'DB',name:'Storage',group:'core',gx:8,gy:8,w:3,d:2,h:.6,slab:true,what:'Persistent state.',how:'Replace with repository evidence.',talks:[]}],edges:[{id:'e1',f:'web',t:'core',pay:'request',flow:true},{id:'e2',f:'core',t:'store',pay:'state',flow:true}],externals:[],trace:[{structureId:'web',sentence:'Request enters the system.'},{structureId:'core',sentence:'Core logic handles the request.'},{structureId:'store',sentence:'State is persisted.'}]};
const S=ATLAS_DATA;let selected=null,tab='what',trace=-1,running=false,zoom=1,pan={x:0,y:0};const map=document.querySelector('#map'),tip=document.querySelector('#tip');const byId=id=>S.structures.find(x=>x.id===id);function proj(gx,gy,z=0){return [600+(gx-gy)*35,170+(gx+gy)*19-z*18]};function poly(pts){return pts.map(p=>p.join(',')).join(' ')}function renderMeta(){document.querySelector('#meta').innerHTML=S.meta.map(x=>`<div class="cell"><div class="lab">${x.label}</div><div class="val">${x.value}</div></div>`).join('')}function renderRail(){document.querySelector('#sysTitle').textContent=S.overview.title;document.querySelector('#sysDesc').textContent=S.overview.subtitle;document.querySelector('#groups').innerHTML=S.groups.map(g=>`<div class="group">${g.name}</div>${g.rowIds.map((id,i)=>{let s=byId(id);return `<div class="row ${selected===id?'active':''}" data-id="${id}"><span>${i+1}</span><span>${s.name}</span><span>${s.code}</span></div>`}).join('')}`).join('');document.querySelectorAll('.row').forEach(r=>r.onclick=()=>{selected=r.dataset.id;renderAll()})}function faces(s){let z=s.h||.5,[a,b,c,d]=[[s.gx,s.gy],[s.gx+s.w,s.gy],[s.gx+s.w,s.gy+s.d],[s.gx,s.gy+s.d]].map(p=>proj(p[0],p[1],z)),[a0,b0,c0,d0]=[[s.gx,s.gy],[s.gx+s.w,s.gy],[s.gx+s.w,s.gy+s.d],[s.gx,s.gy+s.d]].map(p=>proj(p[0],p[1],0));return {top:[a,b,c,d],left:[d,c,c0,d0],right:[b,c,c0,b0]}}function center(s,z=(s.h||0)/2){return proj(s.gx+s.w/2,s.gy+s.d/2,z)}function renderMap(){let defs=`<defs><pattern id="h1" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1b1506" stroke-width=".7"/></pattern><pattern id="h2" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-25)"><line x1="0" y1="0" x2="0" y2="6" stroke="#1b1506" stroke-width=".7"/></pattern></defs>`;let grid='';for(let i=-6;i<24;i++){let p1=proj(i,-4),p2=proj(i,20),p3=proj(-4,i),p4=proj(20,i);grid+=`<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="rgba(27,21,6,.105)"/><line x1="${p3[0]}" y1="${p3[1]}" x2="${p4[0]}" y2="${p4[1]}" stroke="rgba(27,21,6,.105)"/>`}let edges=S.edges.map(e=>{let a=center(byId(e.f),0),b=center(byId(e.t),0),dash=e.dashed?'stroke-dasharray="5 4"':'';return `<g data-edge="${e.id}"><line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#1b1506" stroke-width="1.2" ${dash}/>${e.flow?`<circle class="dot" data-edge-dot="${e.id}" cx="${(a[0]+b[0])/2}" cy="${(a[1]+b[1])/2}" r="5" fill="#efe28d"/>`:''}</g>`}).join('');let blocks=[...S.structures].sort((a,b)=>(a.gx+a.gy)-(b.gx+b.gy)).map(s=>{let f=faces(s),active=selected===s.id||trace>=0&&S.trace[trace]?.structureId===s.id,cc=center(s,s.h+.1);return `<g class="block" data-id="${s.id}" style="cursor:pointer"><polygon points="${poly(f.left)}" fill="url(#h1)" stroke="#1b1506"/><polygon points="${poly(f.right)}" fill="url(#h2)" stroke="#1b1506"/><polygon points="${poly(f.top)}" fill="${active?'#1b1506':'#d8cfaa'}" stroke="#1b1506"/><text x="${cc[0]}" y="${cc[1]+4}" text-anchor="middle" font-size="10" fill="${active?'#d8cfaa':'#1b1506'}">${s.code}</text><text x="${cc[0]}" y="${cc[1]+28}" text-anchor="middle" font-size="12">${s.name}</text></g>`}).join('');map.innerHTML=`${defs}<g transform="translate(${pan.x} ${pan.y}) scale(${zoom})">${grid}${edges}${blocks}</g>`;document.querySelectorAll('.block').forEach(b=>{b.onclick=e=>{e.stopPropagation();selected=b.dataset.id;renderAll()};b.onmousemove=e=>{tip.style.display='block';tip.style.left=e.offsetX+12+'px';tip.style.top=e.offsetY+12+'px';tip.textContent=byId(b.dataset.id).what};b.onmouseleave=()=>tip.style.display='none'})}function renderPanel(){let s=selected?byId(selected):null,obj=s||S.overview;let title=s?s.name:S.overview.title,sub=s?s.code:S.overview.subtitle,body=s?(tab==='what'?s.what:s.how):(tab==='what'?S.overview.what:S.overview.how);let traceHtml=S.trace.length?`<div class="trace"><div class="lab">ACTIVE TRACE</div>${S.trace.map((x,i)=>`<div class="${i===trace?'active':''}">${i+1} ${x.sentence}</div>`).join('')}</div>`:'';document.querySelector('#panel').innerHTML=`<div class="eyebrow">${s?'SELECTED / '+s.code:'OVERVIEW'}</div><h2>${title}</h2><div class="sub">${sub}</div><div class="section"><h3>${tab==='what'?'RESPONSIBILITY':'IMPLEMENTATION'}</h3><p>${body}</p></div>${traceHtml}`}function renderAll(){renderMeta();renderRail();renderMap();renderPanel();document.querySelector('#flowBtn').textContent=running?'PAUSE FLOW':'RESUME FLOW'}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('active',x===b));renderPanel()});document.querySelector('#traceBtn').onclick=()=>{trace=(trace+1)%S.trace.length;selected=S.trace[trace].structureId;renderAll()};document.querySelector('#resetBtn').onclick=()=>{selected=null;trace=-1;zoom=1;pan={x:0,y:0};renderAll()};document.querySelector('#flowBtn').onclick=()=>{running=!running;renderAll()};document.querySelector('#plus').onclick=()=>{zoom=Math.min(2,zoom+.1);renderMap()};document.querySelector('#minus').onclick=()=>{zoom=Math.max(.55,zoom-.1);renderMap()};document.querySelector('#stage').onwheel=e=>{e.preventDefault();zoom=Math.max(.55,Math.min(2,zoom+(e.deltaY<0?.08:-.08)));renderMap()};window.__ATLAS_DEBUG__={getState:()=>({selected,tab,trace,running,zoom,pan}),select:id=>{selected=id;renderAll()},trace:n=>{trace=Math.max(0,Math.min(S.trace.length-1,n));selected=S.trace[trace].structureId;renderAll()}};renderAll();
</script>
</body>
</html>
