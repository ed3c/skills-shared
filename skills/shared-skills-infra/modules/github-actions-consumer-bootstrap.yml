# GENERATED BY DOMAIN-DECOUPLING-V1 CONSUMER BOOTSTRAP
name: Domain Decoupling Consumer Bootstrap

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - '.agents/control-plane/**'
      - '.agents/bindings/repository-control-plane.json'
      - '.github/workflows/domain-decoupling-bootstrap.yml'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'CONTEXT.md'
      - 'ARCHITECTURE.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: domain-decoupling-bootstrap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve immutable shared source
        id: source
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.parse import urlparse
          value = json.loads(Path('.agents/control-plane/source.json').read_text())
          source = value['source']
          slug = urlparse(source['repository']).path.strip('/').removesuffix('.git')
          if slug != 'ed3c/skills-shared':
              raise SystemExit(f'unexpected shared repository: {slug}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f"repository={slug}", file=output)
              print(f"commit={source['commit']}", file=output)
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: .shared-skills-source
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact consumer bootstrap
        env:
          CONSUMER_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .shared-skills-source/skills/shared-skills-infra/scripts/consumer_bootstrap.py \
            --consumer "$GITHUB_WORKSPACE" \
            --repository-id "$CONSUMER_REPOSITORY" \
            --check
