name: Git Town Stacked PR Worker

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - 'skills/git-town-stacked-pr-worker/**'
      - '.github/workflows/git-town-stacked-pr-worker.yml'
  push:
    branches: [main]
    paths:
      - 'skills/git-town-stacked-pr-worker/**'
      - '.github/workflows/git-town-stacked-pr-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: git-town-stacked-pr-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-canary:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Bind checkout to the exact candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$CANDIDATE_SHA" = "$(git rev-parse HEAD)"
          printf 'head=%s\n' "$(git rev-parse HEAD)"
          printf 'tree=%s\n' "$(git rev-parse 'HEAD^{tree}')"
      - name: Run pinned disposable Git Town canaries
        shell: bash
        run: |
          set -euo pipefail
          python3 skills/git-town-stacked-pr-worker/tests/live-git-town/run_canary.py \
            --admission skills/git-town-stacked-pr-worker/tests/live-git-town/admission.json \
            --subject "$CANDIDATE_SHA" \
            --receipt "$RUNNER_TEMP/git-town-live-canary-receipt.json"
      - name: Publish receipt to the workflow summary
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/git-town-live-canary-receipt.json"; then
            {
              echo '## Git Town live-canary receipt'
              echo
              echo '```json'
              cat "$RUNNER_TEMP/git-town-live-canary-receipt.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
