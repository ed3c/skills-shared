name: Commit Role Subject Selection

on:
  pull_request:
    types: [synchronize, opened, reopened, ready_for_review]
    paths:
      - 'scripts/check_commit_roles.py'
      - 'tests/test_commit_role_subject_selection.py'
      - 'evals/commit-roles.json'
      - '.github/workflows/commit-role-subject-selection.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: commit-role-subject-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Prove PR merge-base subject selection
        run: python3 -m unittest tests/test_commit_role_subject_selection.py -v
      - name: Classify only this pull request's commits
        if: github.event_name == 'pull_request'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_commit_roles.py --repo-root .
