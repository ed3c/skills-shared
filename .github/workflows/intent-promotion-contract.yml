name: Intent Promotion Contract

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - 'evals/schema/intent-promotion-*.schema.json'
      - 'evals/fixtures/intent-promotion/**'
      - 'scripts/check_intent_promotions.py'
      - 'scripts/intent_promotion/**'
      - 'tests/test_intent_promotions.py'
      - 'docs/architecture/INTENT_PROMOTION.md'
      - '.github/workflows/intent-promotion-contract.yml'
  push:
    branches: [main]
    paths:
      - 'evals/schema/intent-promotion-*.schema.json'
      - 'evals/fixtures/intent-promotion/**'
      - 'scripts/check_intent_promotions.py'
      - 'scripts/intent_promotion/**'
      - 'tests/test_intent_promotions.py'
      - 'docs/architecture/INTENT_PROMOTION.md'
      - '.github/workflows/intent-promotion-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intent-promotion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Bind exact candidate
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          tree="$(git rev-parse HEAD^{tree})"
          printf 'expected=%s\nobserved=%s\ntree=%s\n' "$EXPECTED_SHA" "$observed" "$tree"
          test "$observed" = "$EXPECTED_SHA"

      - name: Validate lifecycle, bindings, receipts, and controls
        run: |
          set -euo pipefail
          python3 scripts/check_intent_promotions.py contract \
            evals/fixtures/intent-promotion/valid-contract.json \
            --repo-root . --verify-bindings
          for receipt in \
            valid-receipt.json \
            admitted-receipt.json \
            canonical-receipt.json
          do
            python3 scripts/check_intent_promotions.py receipt \
              "evals/fixtures/intent-promotion/$receipt" \
              --contract evals/fixtures/intent-promotion/valid-contract.json \
              --repo-root . --verify-bindings
          done
          python3 scripts/check_intent_promotions.py selftest
          python3 -m unittest tests/test_intent_promotions.py -v

      - name: Validate syntax and stable implementation
        run: |
          set -euo pipefail
          python3 -m compileall -q scripts/check_intent_promotions.py scripts/intent_promotion tests/test_intent_promotions.py
          python3 -m json.tool evals/schema/intent-promotion-contract.schema.json >/dev/null
          python3 -m json.tool evals/schema/intent-promotion-receipt.schema.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-promotion/valid-contract.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-promotion/valid-receipt.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-promotion/admitted-receipt.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-promotion/canonical-receipt.json >/dev/null
