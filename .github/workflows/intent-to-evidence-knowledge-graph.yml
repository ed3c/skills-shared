name: Intent-to-Evidence Knowledge Graph

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - 'skills/intent-to-evidence-knowledge-graph/**'
      - '.github/workflows/intent-to-evidence-knowledge-graph.yml'
  push:
    branches: [main]
    paths:
      - 'skills/intent-to-evidence-knowledge-graph/**'
      - '.github/workflows/intent-to-evidence-knowledge-graph.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intent-to-evidence-knowledge-graph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Draft 2020-12 validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
      - name: Run deterministic graph contract and mutation controls
        env:
          ITEKG_REPOSITORY: ${{ github.repository }}
          ITEKG_REF: ${{ github.head_ref || github.ref_name }}
          ITEKG_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          ITEKG_PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
          ITEKG_EVIDENCE_DIR: ${{ runner.temp }}/intent-to-evidence-knowledge-graph
        run: bash skills/intent-to-evidence-knowledge-graph/tests/run-all.sh
      - name: Upload exact-head deterministic receipt
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: intent-to-evidence-knowledge-graph-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/intent-to-evidence-knowledge-graph
          if-no-files-found: error
          include-hidden-files: true
