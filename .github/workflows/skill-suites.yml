name: Skill Suites

# These skills each ship a tests/run-all.sh that must have a real CI arrival.
# A suite with no CI arrival cannot report a regression. Each skill that owns a
# suite gets an arrival here; skills with a dedicated workflow stay out of this
# matrix.

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - 'skills/agentic-tech-lead-orchestration/**'
      - 'skills/controlled-technical-language-harness/**'
      - 'skills/dual-forge-repository-loop/**'
      - 'skills/github-delivery-loop/**'
      - 'skills/gitlab-delivery-loop/**'
      - 'skills/html-for-decisions/**'
      - 'skills/knowledge-continuity/**'
      - 'skills/procedural-core-refactor/**'
      - 'skills/procedural-shadow-runtime/**'
      - 'skills/repository-capability-audit/**'
      - 'skills/spatial-loop-systems-engineering/**'
      - 'scripts/check_intent_bound_constraints.py'
      - 'scripts/check_suite_ci_coverage.py'
      - '.github/workflows/skill-suites.yml'
  push:
    branches: [main]
    paths:
      - 'skills/agentic-tech-lead-orchestration/**'
      - 'skills/controlled-technical-language-harness/**'
      - 'skills/dual-forge-repository-loop/**'
      - 'skills/github-delivery-loop/**'
      - 'skills/gitlab-delivery-loop/**'
      - 'skills/html-for-decisions/**'
      - 'skills/knowledge-continuity/**'
      - 'skills/procedural-core-refactor/**'
      - 'skills/procedural-shadow-runtime/**'
      - 'skills/repository-capability-audit/**'
      - 'skills/spatial-loop-systems-engineering/**'
      - 'scripts/check_intent_bound_constraints.py'
      - 'scripts/check_suite_ci_coverage.py'
      - '.github/workflows/skill-suites.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-suites-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the workflow parser the gate refuses to work without
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Every skill suite must be run by a CI job
        run: python3 scripts/check_suite_ci_coverage.py

  suite:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        skill:
          - agentic-tech-lead-orchestration
          - controlled-technical-language-harness
          - dual-forge-repository-loop
          - github-delivery-loop
          - gitlab-delivery-loop
          - html-for-decisions
          - knowledge-continuity
          - procedural-core-refactor
          - procedural-shadow-runtime
          - repository-capability-audit
          - spatial-loop-systems-engineering
    name: ${{ matrix.skill }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned Draft 2020-12 validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
      - name: Run ${{ matrix.skill }} suite
        env:
          RCA_EVIDENCE_DIR: ${{ matrix.skill == 'repository-capability-audit' && format('{0}/evidence/run-all', runner.temp) || '' }}
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/evidence"
          bash "skills/${{ matrix.skill }}/tests/run-all.sh" 2>&1 \
            | tee "${RUNNER_TEMP}/evidence/suite.log"

      - name: Collect procedural-core refactor golden-proof bundle
        if: always() && matrix.skill == 'procedural-core-refactor'
        run: |
          mkdir -p "${RUNNER_TEMP}/evidence/procedural-core-refactor"
          cp skills/procedural-core-refactor/references/refactor-contract.schema.json \
             skills/procedural-core-refactor/references/example-refactor-contract.json \
             skills/procedural-core-refactor/references/golden-proof.schema.json \
             skills/procedural-core-refactor/references/tech-lead-golden-proof.json \
             "${RUNNER_TEMP}/evidence/procedural-core-refactor/"
          python3 skills/procedural-core-refactor/scripts/check_refactor_contract.py \
            --contract skills/procedural-core-refactor/references/example-refactor-contract.json \
            --proof skills/procedural-core-refactor/references/tech-lead-golden-proof.json \
            --receipt "${RUNNER_TEMP}/evidence/procedural-core-refactor/validation-receipt.json"
          python3 scripts/evidence_bundle.py collect "${RUNNER_TEMP}/evidence" \
            --output "${RUNNER_TEMP}/procedural-core-refactor-bundle" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')"
          python3 scripts/evidence_bundle.py verify "${RUNNER_TEMP}/procedural-core-refactor-bundle"

      - name: Upload procedural-core refactor golden-proof bundle
        if: always() && matrix.skill == 'procedural-core-refactor'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-procedural-core-refactor-${{ github.sha }}
          path: ${{ runner.temp }}/procedural-core-refactor-bundle
          if-no-files-found: error
          include-hidden-files: true

      # Only the skills whose Issues are waiting on a replayable artifact: #212
      # for procedural-shadow-runtime, #222 for repository-capability-audit.
      - name: Collect exact-head evidence bundle
        if: always() && (matrix.skill == 'procedural-shadow-runtime' || matrix.skill == 'repository-capability-audit')
        run: |
          cp -R "skills/${{ matrix.skill }}/evals" "${RUNNER_TEMP}/evidence/evals"
          cp "skills/${{ matrix.skill }}/evals.json" "${RUNNER_TEMP}/evidence/eval-plane.json"
          python3 scripts/evidence_bundle.py collect "${RUNNER_TEMP}/evidence" \
            --output "${RUNNER_TEMP}/bundle" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')"
          python3 scripts/evidence_bundle.py verify "${RUNNER_TEMP}/bundle"

      - name: Upload exact-head evidence bundle
        if: always() && (matrix.skill == 'procedural-shadow-runtime' || matrix.skill == 'repository-capability-audit')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.skill }}-${{ github.sha }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
          include-hidden-files: true
