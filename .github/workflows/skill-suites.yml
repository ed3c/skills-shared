name: Skill Suites

# These skills each ship a tests/run-all.sh that must have a real CI arrival.
# A suite with no CI arrival cannot report a regression: #83 (a selftest that
# had been red on main) and #105 (two verifiers that had never executed at all)
# both landed through exactly that gap. Each skill that owns a suite gets an
# arrival here; skills with their own dedicated workflow keep it and stay out
# of this matrix.

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - 'skills/agentic-tech-lead-orchestration/**'
      - 'skills/controlled-technical-language-harness/**'
      - 'skills/dual-forge-repository-loop/**'
      - 'skills/github-delivery-loop/**'
      - 'skills/gitlab-delivery-loop/**'
      - 'skills/html-for-decisions/**'
      - 'skills/knowledge-continuity/**'
      - 'skills/procedural-shadow-runtime/**'
      - 'skills/repository-capability-audit/**'
      - 'skills/spatial-loop-systems-engineering/**'
      - 'scripts/check_intent_bound_constraints.py'
      - 'scripts/check_suite_ci_coverage.py'
      - '.github/workflows/skill-suites.yml'
  push:
    branches: [main]
    paths:
      - 'skills/agentic-tech-lead-orchestration/**'
      - 'skills/controlled-technical-language-harness/**'
      - 'skills/dual-forge-repository-loop/**'
      - 'skills/github-delivery-loop/**'
      - 'skills/gitlab-delivery-loop/**'
      - 'skills/html-for-decisions/**'
      - 'skills/knowledge-continuity/**'
      - 'skills/procedural-shadow-runtime/**'
      - 'skills/repository-capability-audit/**'
      - 'skills/spatial-loop-systems-engineering/**'
      - 'scripts/check_intent_bound_constraints.py'
      - 'scripts/check_suite_ci_coverage.py'
      - '.github/workflows/skill-suites.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-suites-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the workflow parser the gate refuses to work without
        run: python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Every skill suite must be run by a CI job
        run: python3 scripts/check_suite_ci_coverage.py

  suite:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        skill:
          - agentic-tech-lead-orchestration
          - controlled-technical-language-harness
          - dual-forge-repository-loop
          - github-delivery-loop
          - gitlab-delivery-loop
          - html-for-decisions
          - knowledge-continuity
          - procedural-shadow-runtime
          - repository-capability-audit
          - spatial-loop-systems-engineering
    name: ${{ matrix.skill }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned Draft 2020-12 validator
        # The controlled-language authority composition executes the committed
        # schemas as deciding gates and exits 70 rather than skipping when the
        # validator is absent. Installing it here is what lets that gate run at
        # all in this job; without it the suite fails on an environment gap
        # rather than on a defect.
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
      - name: Run ${{ matrix.skill }} suite
        run: |
          set -o pipefail
          mkdir -p "${RUNNER_TEMP}/evidence"
          bash "skills/${{ matrix.skill }}/tests/run-all.sh" 2>&1 \
            | tee "${RUNNER_TEMP}/evidence/suite.log"

      # Only the skill #212 names. Collecting a bundle from every matrix leg would
      # spend upload on jobs whose evidence nothing is waiting for.
      - name: Collect exact-head evidence bundle
        if: always() && matrix.skill == 'procedural-shadow-runtime'
        run: |
          cp -R "skills/${{ matrix.skill }}/evals" "${RUNNER_TEMP}/evidence/evals"
          cp "skills/${{ matrix.skill }}/evals.json" "${RUNNER_TEMP}/evidence/eval-plane.json"
          python3 scripts/evidence_bundle.py collect "${RUNNER_TEMP}/evidence" \
            --output "${RUNNER_TEMP}/bundle" \
            --tree-sha "$(git rev-parse 'HEAD^{tree}')"
          # Verify here as well as on download: a bundle that cannot be replayed
          # in the job that produced it will not become replayable later.
          python3 scripts/evidence_bundle.py verify "${RUNNER_TEMP}/bundle"

      - name: Upload exact-head evidence bundle
        if: always() && matrix.skill == 'procedural-shadow-runtime'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evidence-${{ matrix.skill }}-${{ github.sha }}
          path: ${{ runner.temp }}/bundle
          if-no-files-found: error
