name: Issue Closure Contract

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'skills/agentic-tech-lead-orchestration/references/issue-closure-contract.schema.json'
      - 'skills/agentic-tech-lead-orchestration/references/closure-audit/**'
      - 'skills/agentic-tech-lead-orchestration/scripts/assert_issue_closure_contract.py'
      - 'skills/agentic-tech-lead-orchestration/tests/test_issue_closure_contract.py'
      - '.github/workflows/issue-closure-contract.yml'
  push:
    branches: [main]
    paths:
      - 'skills/agentic-tech-lead-orchestration/references/issue-closure-contract.schema.json'
      - 'skills/agentic-tech-lead-orchestration/references/closure-audit/**'
      - 'skills/agentic-tech-lead-orchestration/scripts/assert_issue_closure_contract.py'
      - 'skills/agentic-tech-lead-orchestration/tests/test_issue_closure_contract.py'
      - '.github/workflows/issue-closure-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-closure-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  closure-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Draft 2020-12 validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
      - name: Validate schema and audited closure packets
        run: |
          set -eu
          ROOT=skills/agentic-tech-lead-orchestration
          python3 -m json.tool "$ROOT/references/issue-closure-contract.schema.json" >/dev/null
          python3 - "$ROOT" <<'PY'
          import json, sys
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path(sys.argv[1])
          schema = json.loads((root / 'references/issue-closure-contract.schema.json').read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          packets = sorted((root / 'references/closure-audit').glob('issue-*.json'))
          assert packets, 'closure-audit ledger is empty'
          for packet in packets:
              value = json.loads(packet.read_text(encoding='utf-8'))
              errors = list(Draft202012Validator(schema).iter_errors(value))
              assert not errors, (packet.name, [e.message for e in errors])
              print(f'ISSUE-CLOSURE-SHAPE-GREEN {packet.name}')
          PY
          python3 "$ROOT/tests/test_issue_closure_contract.py"
          for packet in "$ROOT"/references/closure-audit/issue-*.json; do
            python3 "$ROOT/scripts/assert_issue_closure_contract.py" "$packet"
          done
