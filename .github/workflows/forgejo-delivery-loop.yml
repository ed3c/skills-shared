name: Forgejo Delivery Loop Contract

on:
  pull_request:
    types:
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - 'skills/forgejo-delivery-loop/**'
      - 'scripts/check_intent_bound_constraints.py'
      - '.github/workflows/forgejo-delivery-loop.yml'
  push:
    branches: [main]
    paths:
      - 'skills/forgejo-delivery-loop/**'
      - 'scripts/check_intent_bound_constraints.py'
      - '.github/workflows/forgejo-delivery-loop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgejo-delivery-loop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.2.19'
      - name: Run the Forgejo routing and merge-authority contract
        run: bash skills/forgejo-delivery-loop/tests/run-all.sh
      - name: Validate the Intent-Bound contract against the repository evaluator
        run: |
          python3 scripts/check_intent_bound_constraints.py \
            contract skills/forgejo-delivery-loop/tests/intent-bound-contract/intent-contract.json
