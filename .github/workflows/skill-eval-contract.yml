name: Skill Eval Contract

on:
  pull_request:
    types:
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - 'evals/**'
      - 'mutations/**'
      - 'scripts/check_skill_evals.py'
      - 'scripts/check_verifier_calibrations.py'
      - 'scripts/check_mutation_lineage.py'
      - 'scripts/check_mutation_targets.py'
      - 'scripts/check_mutation_promotions.py'
      - 'scripts/check_capability_unlocks.py'
      - 'scripts/check_release_receipts.py'
      - 'scripts/render_scorecard_index.py'
      - 'scripts/check_dead_assertions.py'
      - 'scripts/summarize_skill_eval_matrix.py'
      - 'scripts/summarize_cross_harness_gap.py'
      - 'scripts/export_skill_eval_runtime.py'
      - 'scripts/collect_skill_up_executor_evidence.py'
      - 'scripts/verify_collected_runtime.py'
      - 'scripts/build_verified_run.py'
      - 'scripts/check_intent_bound_constraints.py'
      - 'skills/shared-skills-infra/scripts/check_dead_assertions.py'
      - 'skills/shared-skills-infra/tests/**'
      - 'tests/test_skill_eval_gate.py'
      - 'tests/test_verifier_calibrations.py'
      - 'tests/test_autoresearch_eval_v1.py'
      - 'tests/test_cross_harness_contract.py'
      - 'tests/test_cross_harness_gap.py'
      - 'tests/test_mutation_lineage.py'
      - 'tests/test_mutation_targets.py'
      - 'tests/test_mutation_promotions.py'
      - 'tests/test_capability_unlocks.py'
      - 'tests/test_release_receipts.py'
      - 'tests/test_scorecard_index.py'
      - 'tests/test_runtime_export.py'
      - 'tests/test_skill_up_executor_evidence.py'
      - 'tests/test_verifier_authority.py'
      - 'tests/test_verify_collected_runtime.py'
      - 'tests/test_build_verified_run.py'
      - 'tests/test_dead_assertions.py'
      - 'tests/test_dead_assertion_mutations.py'
      - 'tests/test_intent_bound_constraints.py'
      - '.github/workflows/skill-eval-contract.yml'
  push:
    branches: [main]
    paths:
      - 'evals/**'
      - 'mutations/**'
      - 'scripts/**'
      - 'skills/shared-skills-infra/scripts/check_dead_assertions.py'
      - 'skills/shared-skills-infra/tests/**'
      - 'tests/**'
      - '.github/workflows/skill-eval-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-eval-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate eval coverage, implementation targets, and sealed holdouts
        run: python3 scripts/check_skill_evals.py
      - name: Validate Intent-Bound Constraint closure and receipts
        run: |
          python3 scripts/check_intent_bound_constraints.py contract evals/fixtures/intent-bound-constraint/valid-contract.json
          python3 scripts/check_intent_bound_constraints.py receipt evals/fixtures/intent-bound-constraint/valid-receipt.json --contract evals/fixtures/intent-bound-constraint/valid-contract.json
          python3 -m unittest tests/test_intent_bound_constraints.py -v
      - name: Calibrate deterministic gold-replay verifiers
        run: |
          python3 scripts/check_verifier_calibrations.py
          python3 -m unittest tests/test_verifier_calibrations.py -v
      - name: Validate mutation lineage and optimizer-visible targets
        run: |
          python3 scripts/check_mutation_lineage.py
          python3 scripts/check_mutation_targets.py
          python3 scripts/check_mutation_promotions.py
      - name: Validate capability unlock registry
        run: python3 scripts/check_capability_unlocks.py
      - name: Validate verified capability releases
        run: python3 scripts/check_release_receipts.py
      - name: Validate generated scorecard index
        run: python3 scripts/render_scorecard_index.py --check
      - name: Validate shell assertion gates
        run: |
          python3 scripts/check_dead_assertions.py
          python3 -m unittest tests/test_dead_assertions.py -v
          python3 -m unittest tests/test_dead_assertion_mutations.py -v
      - name: Run eval contract suites
        run: |
          python3 -m unittest tests/test_skill_eval_gate.py -v
          python3 -m unittest tests/test_autoresearch_eval_v1.py -v
          python3 -m unittest tests/test_cross_harness_contract.py -v
          python3 -m unittest tests/test_cross_harness_gap.py -v
          python3 -m unittest tests/test_mutation_lineage.py -v
          python3 -m unittest tests/test_mutation_targets.py -v
          python3 -m unittest tests/test_mutation_promotions.py -v
          python3 -m unittest tests/test_capability_unlocks.py -v
          python3 -m unittest tests/test_release_receipts.py -v
          python3 -m unittest tests/test_scorecard_index.py -v
          python3 -m unittest tests/test_runtime_export.py -v
          python3 -m unittest tests/test_skill_up_executor_evidence.py -v
          python3 -m unittest tests/test_verifier_authority.py -v
          python3 -m unittest tests/test_verify_collected_runtime.py -v
          python3 -m unittest tests/test_build_verified_run.py -v
      - name: Compile runtime and adapter scripts
        run: python3 -m compileall -q scripts evals/adapters evals/verifiers tests skills/shared-skills-infra/scripts
      - name: Validate authority, executor, eval, mutation, release, scorecard, and intent JSON contracts
        run: |
          python3 -m json.tool evals/runtime/executors/arena.json >/dev/null
          python3 -m json.tool evals/runtime/executors/skill-up.json >/dev/null
          python3 -m json.tool evals/schema/skill-eval-contract.schema.json >/dev/null
          python3 -m json.tool evals/schema/verifier-receipt.schema.json >/dev/null
          python3 -m json.tool evals/schema/evidence-bundle.schema.json >/dev/null
          python3 -m json.tool evals/schema/run-trace.schema.json >/dev/null
          python3 -m json.tool evals/schema/intent-bound-constraint.schema.json >/dev/null
          python3 -m json.tool evals/schema/diagnostic-reflection-receipt.schema.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-bound-constraint/valid-contract.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-bound-constraint/valid-receipt.json >/dev/null
          python3 -m json.tool mutations/promotions.json >/dev/null
          python3 -m json.tool mutations/schema/mutation-eval.schema.json >/dev/null
          python3 -m json.tool mutations/schema/mutation-lineage.schema.json >/dev/null
          python3 -m json.tool mutations/schema/mutation-promotion-registry.schema.json >/dev/null
          python3 -m json.tool evals/schema/release-receipt.schema.json >/dev/null
          python3 -m json.tool evals/schema/skill-scorecard.schema.json >/dev/null
          python3 -m json.tool evals/releases.json >/dev/null
          python3 -m json.tool evals/scorecards/index.json >/dev/null
      - name: Exercise gold replay verifier safe-block path
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/evidence"
          cat > "$tmp/evidence/preflight.json" <<'JSON'
          {
            "repository": "ed3c/disposable-skill-eval",
            "pull_request": 1,
            "expected_head_sha": "0123456789abcdef",
            "viewer_id": "fixture-viewer",
            "author_identity_source": "remote-preflight-fixture",
            "remote_author_identity_proven": false,
            "merge_mutation_attempted": false,
            "decision": "BLOCKED"
          }
          JSON
          (cd "$tmp" && python3 "$GITHUB_WORKSPACE/evals/verifiers/verify_issue_25_contract.py")
