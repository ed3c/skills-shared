name: Skill Eval Contract

on:
  pull_request:
    paths:
      - 'evals/**'
      - 'mutations/**'
      - 'scripts/check_skill_evals.py'
      - 'scripts/check_mutation_lineage.py'
      - 'scripts/summarize_skill_eval_matrix.py'
      - 'tests/test_skill_eval_gate.py'
      - 'tests/test_autoresearch_eval_v1.py'
      - 'tests/test_cross_harness_contract.py'
      - 'tests/test_mutation_lineage.py'
      - '.github/workflows/skill-eval-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'evals/**'
      - 'mutations/**'
      - 'scripts/check_skill_evals.py'
      - 'scripts/check_mutation_lineage.py'
      - 'scripts/summarize_skill_eval_matrix.py'
      - 'tests/test_skill_eval_gate.py'
      - 'tests/test_autoresearch_eval_v1.py'
      - 'tests/test_cross_harness_contract.py'
      - 'tests/test_mutation_lineage.py'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate eval coverage and sealed holdouts
        run: python3 scripts/check_skill_evals.py
      - name: Validate mutation lineage
        run: python3 scripts/check_mutation_lineage.py
      - name: Run mutation-style gate tests
        run: python3 -m unittest tests/test_skill_eval_gate.py -v
      - name: Run autoresearch outcome eval tests
        run: python3 -m unittest tests/test_autoresearch_eval_v1.py -v
      - name: Run cross-harness contract tests
        run: python3 -m unittest tests/test_cross_harness_contract.py -v
      - name: Run mutation lineage tests
        run: python3 -m unittest tests/test_mutation_lineage.py -v
      - name: Exercise gold replay verifier safe-block path
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/evidence"
          cat > "$tmp/evidence/preflight.json" <<'JSON'
          {
            "repository": "ed3c/disposable-skill-eval",
            "pull_request": 1,
            "expected_head_sha": "0123456789abcdef",
            "viewer_id": "fixture-viewer",
            "author_identity_source": "remote-preflight-fixture",
            "remote_author_identity_proven": false,
            "merge_mutation_attempted": false,
            "decision": "BLOCKED"
          }
          JSON
          (cd "$tmp" && python3 "$GITHUB_WORKSPACE/evals/verifiers/verify_issue_25_contract.py")
