name: Skill Eval Contract

on:
  pull_request:
    # Sealed to ready_for_review only. The repository is public now, so the
    # private-repo billing gate (.github-delivery/ci-policy.json) is retired,
    # but publication cadence stays the gate: one deliberate run per review
    # request, never a side effect of how often someone commits.
    types:
      - ready_for_review
    paths:
      - 'evals/**'
      - 'mutations/**'
      - 'scripts/check_skill_evals.py'
      - 'scripts/check_verifier_calibrations.py'
      - 'scripts/check_mutation_lineage.py'
      - 'scripts/check_mutation_targets.py'
      - 'scripts/check_mutation_promotions.py'
      - 'scripts/check_capability_unlocks.py'
      - 'scripts/check_release_receipts.py'
      - 'scripts/render_scorecard_index.py'
      - 'scripts/check_dead_assertions.py'
      - 'scripts/summarize_skill_eval_matrix.py'
      - 'scripts/summarize_cross_harness_gap.py'
      - 'scripts/export_skill_eval_runtime.py'
      - 'scripts/collect_skill_up_executor_evidence.py'
      - 'scripts/verify_collected_runtime.py'
      - 'scripts/build_verified_run.py'
      - 'scripts/check_intent_bound_constraints.py'
      - 'scripts/check_intent_promotions.py'
      - 'migration/**'
      - 'scripts/check_commit_roles.py'
      - 'evals/index-coverage.json'
      - 'scripts/check_binding_stale.py'
      - 'skills/shared-skills-infra/**'
      - '.skill-bindings/**'
      - 'scripts/check_body_neutrality.py'
      - 'evals/body-neutrality.json'
      - 'skills/**'
      - 'scripts/check_skill_eval_plane.py'
      - 'scripts/skill_eval_plane_selftest.py'
      - 'scripts/check_guard_controls.py'
      - 'scripts/measure_delivery_shape.py'
      - 'scripts/check_executor_authority.py'
      - 'evals/runtime/executors/**'
      - 'scripts/delivery_shape_selftest.py'
      - 'evals/fixtures/delivery-shape/**'
      - 'scripts/guard_control_selftest.py'
      - 'evals/guard-controls.json'
      - 'tests/test_guard_controls.py'
      - 'evals/commit-roles.json'
      - 'tests/test_commit_roles.py'
      - 'scripts/check_controlled_language_contracts.py'
      - 'scripts/controlled_language/**'
      - 'skills/shared-skills-infra/scripts/check_dead_assertions.py'
      - 'skills/shared-skills-infra/tests/**'
      - 'tests/test_skill_eval_gate.py'
      - 'tests/test_verifier_calibrations.py'
      - 'tests/test_autoresearch_eval_v1.py'
      - 'tests/test_cross_harness_contract.py'
      - 'tests/test_cross_harness_gap.py'
      - 'tests/test_mutation_lineage.py'
      - 'tests/test_mutation_targets.py'
      - 'tests/test_mutation_promotions.py'
      - 'tests/test_capability_unlocks.py'
      - 'tests/test_release_receipts.py'
      - 'tests/test_scorecard_index.py'
      - 'tests/test_runtime_export.py'
      - 'tests/test_skill_up_executor_evidence.py'
      - 'tests/test_verifier_authority.py'
      - 'tests/test_verify_collected_runtime.py'
      - 'tests/test_build_verified_run.py'
      - 'tests/test_dead_assertions.py'
      - 'tests/test_dead_assertion_mutations.py'
      - 'tests/test_intent_bound_constraints.py'
      - 'tests/test_intent_promotions.py'
      - 'tests/test_controlled_language_contracts.py'
      # The routing gate's subject is every governed Markdown file plus the
      # tree it claims to describe, so a docs-only or AGENTS.md-only edit is a
      # change to what it checks -- selecting it on scripts/ alone would let
      # the index drift from the inventory without ever selecting the job.
      - 'scripts/check_document_routes.py'
      - 'tests/test_document_routes.py'
      - 'docs/**'
      - 'AGENTS.md'
      - 'README.md'
      - 'CONTEXT.md'
      - 'ARCHITECTURE.md'
      - '.github/workflows/skill-eval-contract.yml'
  push:
    branches: [main]
    paths:
      - 'evals/**'
      - 'mutations/**'
      - 'scripts/**'
      - 'skills/shared-skills-infra/scripts/check_dead_assertions.py'
      - 'skills/shared-skills-infra/tests/**'
      # The eval plane reads every skills/*/evals.json. The pull_request filter
      # above selects all of skills/**, but this one did not, and this repository
      # lands directly on main -- so three plane defects rode in with an
      # integration and stayed invisible until an unrelated change under
      # shared-skills-infra/tests happened to select this job. Narrow to the
      # declarations themselves rather than widening to skills/**, which would
      # spend a job on every unrelated Skill edit.
      - 'skills/*/evals.json'
      - 'tests/**'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/workflows/skill-eval-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-eval-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # check_commit_roles.py walks back to enforced_from. The default
          # shallow clone has one commit, so that range cannot be resolved and
          # the gate fails closed with exit 64 rather than skipping silently.
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        # The guard-control step executes the Forgejo routing selftest. That
        # guard exits 70 when Bun is absent rather than claiming unreachable
        # assertions are green, so the aggregate workflow must supply the same
        # pinned runtime as the owning Forgejo workflow.
        with:
          bun-version: '1.2.19'
      - name: Install the parsers the gates refuse to work without
        # Three gates here execute a document rather than pattern-matching it:
        # the suite-arrival gate parses workflows, and the authority layer runs
        # the committed schemas as Draft 2020-12 validators. Each fails closed
        # when its parser is absent, so the job must supply them rather than
        # letting the strictest checks be the ones that silently do not run.
        run: |
          python3 -m pip install --disable-pip-version-check \
            'PyYAML==6.0.3' 'jsonschema==4.26.0'
      - name: Validate eval coverage, implementation targets, and sealed holdouts
        run: python3 scripts/check_skill_evals.py
      - name: Validate Intent-Bound Constraint closure and receipts
        run: |
          python3 scripts/check_intent_bound_constraints.py contract evals/fixtures/intent-bound-constraint/valid-contract.json
          python3 scripts/check_intent_bound_constraints.py receipt evals/fixtures/intent-bound-constraint/valid-receipt.json --contract evals/fixtures/intent-bound-constraint/valid-contract.json
          python3 -m unittest tests/test_intent_bound_constraints.py -v
      - name: Validate controlled-language contract foundation
        run: |
          python3 scripts/check_intent_bound_constraints.py contract evals/fixtures/controlled-language/intent-contract.json
          python3 scripts/check_controlled_language_contracts.py bundle \
            --request evals/fixtures/controlled-language/valid-request.json \
            --standard-pack evals/fixtures/controlled-language/valid-standard-pack.json \
            --termbase \
              evals/fixtures/controlled-language/valid-termbase-tn.json \
              evals/fixtures/controlled-language/valid-termbase-tv.json \
            --violation evals/fixtures/controlled-language/valid-violation.json \
            --receipt evals/fixtures/controlled-language/valid-receipt.json
          python3 -m unittest tests/test_controlled_language_contracts.py -v
      - name: Bound what an execution adapter may claim
        run: |
          python3 scripts/check_executor_authority.py --repo-root .
          python3 scripts/check_executor_authority.py --repo-root . --selftest
      - name: Refuse an unfair delivery-shape comparison
        run: |
          python3 scripts/measure_delivery_shape.py selftest
          python3 scripts/measure_delivery_shape.py measure \
            evals/fixtures/delivery-shape/observation-2026-08-14.json >/dev/null
      - name: Prove every declared guard is caught by a control
        run: |
          python3 skills/shared-skills-infra/scripts/check_index.py --selftest
          python3 skills/shared-skills-infra/scripts/check_index_coverage.py --selftest
          python3 skills/shared-skills-infra/scripts/check_index_coverage.py
          python3 scripts/evidence_bundle.py --selftest
          python3 scripts/collect_host_receipt.py --selftest
          python3 scripts/check_binding_stale.py --selftest
          python3 scripts/check_body_neutrality.py --selftest
          python3 scripts/check_body_neutrality.py
          python3 scripts/skill_eval_plane_selftest.py
          python3 scripts/check_skill_eval_plane.py
          python3 scripts/check_guard_controls.py --repo-root . --selftest
          python3 -m unittest tests/test_guard_controls.py -v
          python3 scripts/check_guard_controls.py --repo-root .
      - name: Execute the document-routing contract
        # DOCUMENT_ROUTING.md declared DR-01..DR-19 and nothing ran them, so
        # every route it describes was green by construction. This runs the
        # mechanisable subset against the tree and then proves, per assertion,
        # that the gate goes red on a planted defect.
        run: |
          python3 scripts/check_document_routes.py
          python3 -m unittest tests/test_document_routes.py -v
      - name: Classify commit drivers since the enforced start point
        run: |
          python3 scripts/check_commit_roles.py --repo-root .
          python3 -m unittest tests/test_commit_roles.py -v
      - name: Run migration tooling selftests
        shell: bash
        run: |
          set -euo pipefail
          # These live outside skills/, so check_suite_ci_coverage.py cannot see
          # them. Without this step they have no CI arrival at all.
          for tool in migration/*.py; do
            printf -- '--- %s\n' "${tool}"
            python3 "${tool}" --selftest
          done
      - name: Validate intent-promotion lifecycle and writeback gate
        run: |
          python3 scripts/check_intent_promotions.py contract evals/fixtures/intent-promotion/valid-contract.json
          for receipt in valid canonical supersede; do
            python3 scripts/check_intent_promotions.py receipt \
              "evals/fixtures/intent-promotion/${receipt}-receipt.json" \
              --contract evals/fixtures/intent-promotion/valid-contract.json \
              --ledger evals/fixtures/intent-promotion/ledger.json
          done
          python3 scripts/check_intent_promotions.py selftest
          python3 -m unittest tests/test_intent_promotions.py -v
      - name: Calibrate deterministic gold-replay verifiers
        run: |
          python3 scripts/check_verifier_calibrations.py
          python3 -m unittest tests/test_verifier_calibrations.py -v
      - name: Validate mutation lineage and optimizer-visible targets
        run: |
          python3 scripts/check_mutation_lineage.py
          python3 scripts/check_mutation_targets.py
          python3 scripts/check_mutation_promotions.py
      - name: Validate capability unlock registry
        run: python3 scripts/check_capability_unlocks.py
      - name: Validate verified capability releases
        run: python3 scripts/check_release_receipts.py
      - name: Validate generated scorecard index
        run: python3 scripts/render_scorecard_index.py --check
      - name: Validate shell assertion gates
        run: |
          python3 scripts/check_dead_assertions.py
          python3 -m unittest tests/test_dead_assertions.py -v
          python3 -m unittest tests/test_dead_assertion_mutations.py -v
      - name: Run eval contract suites
        run: |
          python3 -m unittest tests/test_skill_eval_gate.py -v
          python3 -m unittest tests/test_autoresearch_eval_v1.py -v
          python3 -m unittest tests/test_cross_harness_contract.py -v
          python3 -m unittest tests/test_cross_harness_gap.py -v
          python3 -m unittest tests/test_mutation_lineage.py -v
          python3 -m unittest tests/test_mutation_targets.py -v
          python3 -m unittest tests/test_mutation_promotions.py -v
          python3 -m unittest tests/test_capability_unlocks.py -v
          python3 -m unittest tests/test_release_receipts.py -v
          python3 -m unittest tests/test_scorecard_index.py -v
          python3 -m unittest tests/test_runtime_export.py -v
          python3 -m unittest tests/test_skill_up_executor_evidence.py -v
          python3 -m unittest tests/test_verifier_authority.py -v
          python3 -m unittest tests/test_verify_collected_runtime.py -v
          python3 -m unittest tests/test_build_verified_run.py -v
      - name: Compile runtime and adapter scripts
        run: python3 -m compileall -q scripts evals/adapters evals/verifiers tests skills/shared-skills-infra/scripts
      - name: Validate authority, executor, eval, mutation, release, scorecard, intent, and controlled-language JSON contracts
        run: |
          python3 -m json.tool evals/runtime/executors/arena.json >/dev/null
          python3 -m json.tool evals/runtime/executors/skill-up.json >/dev/null
          python3 -m json.tool evals/schema/skill-eval-contract.schema.json >/dev/null
          python3 -m json.tool evals/schema/verifier-receipt.schema.json >/dev/null
          python3 -m json.tool evals/schema/evidence-bundle.schema.json >/dev/null
          python3 -m json.tool evals/schema/run-trace.schema.json >/dev/null
          python3 -m json.tool evals/schema/intent-bound-constraint.schema.json >/dev/null
          python3 -m json.tool evals/schema/skill-eval-executor-authority.schema.json >/dev/null
          python3 -m json.tool evals/schema/intent-promotion-contract.schema.json >/dev/null
          python3 -m json.tool evals/schema/intent-promotion-receipt.schema.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-promotion/valid-contract.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-promotion/valid-receipt.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-promotion/canonical-receipt.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-promotion/supersede-receipt.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-promotion/ledger.json >/dev/null
          python3 -m json.tool evals/schema/diagnostic-reflection-receipt.schema.json >/dev/null
          python3 -m json.tool evals/schema/controlled-language-request.schema.json >/dev/null
          python3 -m json.tool evals/schema/controlled-language-violation.schema.json >/dev/null
          python3 -m json.tool evals/schema/controlled-language-receipt.schema.json >/dev/null
          python3 -m json.tool evals/schema/standard-pack-reference.schema.json >/dev/null
          python3 -m json.tool evals/schema/termbase-entry.schema.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-bound-constraint/valid-contract.json >/dev/null
          python3 -m json.tool evals/fixtures/intent-bound-constraint/valid-receipt.json >/dev/null
          python3 -m json.tool evals/fixtures/controlled-language/intent-contract.json >/dev/null
          python3 -m json.tool evals/fixtures/controlled-language/valid-request.json >/dev/null
          python3 -m json.tool evals/fixtures/controlled-language/valid-standard-pack.json >/dev/null
          python3 -m json.tool evals/fixtures/controlled-language/valid-termbase-tn.json >/dev/null
          python3 -m json.tool evals/fixtures/controlled-language/valid-termbase-tv.json >/dev/null
          python3 -m json.tool evals/fixtures/controlled-language/valid-violation.json >/dev/null
          python3 -m json.tool evals/fixtures/controlled-language/valid-receipt.json >/dev/null
          python3 -m json.tool mutations/promotions.json >/dev/null
          python3 -m json.tool mutations/schema/mutation-eval.schema.json >/dev/null
          python3 -m json.tool mutations/schema/mutation-lineage.schema.json >/dev/null
          python3 -m json.tool mutations/schema/mutation-promotion-registry.schema.json >/dev/null
          python3 -m json.tool evals/schema/release-receipt.schema.json >/dev/null
          python3 -m json.tool evals/schema/skill-scorecard.schema.json >/dev/null
          python3 -m json.tool evals/releases.json >/dev/null
          python3 -m json.tool evals/scorecards/index.json >/dev/null
      - name: Exercise gold replay verifier safe-block path
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/evidence"
          cat > "$tmp/evidence/preflight.json" <<'JSON'
          {
            "repository": "ed3c/disposable-skill-eval",
            "pull_request": 1,
            "expected_head_sha": "0123456789abcdef",
            "viewer_id": "fixture-viewer",
            "author_identity_source": "remote-preflight-fixture",
            "remote_author_identity_proven": false,
            "merge_mutation_attempted": false,
            "decision": "BLOCKED"
          }
          JSON
          (cd "$tmp" && python3 "$GITHUB_WORKSPACE/evals/verifiers/verify_issue_25_contract.py")
