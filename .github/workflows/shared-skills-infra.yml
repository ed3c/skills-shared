name: Shared Skills Infra

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - 'skills/shared-skills-infra/**'
      - '.github/workflows/shared-skills-infra.yml'
  push:
    branches: [main]
    paths:
      - 'skills/shared-skills-infra/**'
      - '.github/workflows/shared-skills-infra.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-skills-infra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned validator
        # check_skill_bootstrap.py exits 70 rather than skipping schema validation
        # when jsonschema is absent, so an uninstalled validator fails the job
        # instead of quietly reducing the gate to its semantic half.
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0'
      - name: Verify shared-skills governance
        run: bash skills/shared-skills-infra/tests/verify.sh
      - name: Verify canonical-drift behavior
        run: bash skills/shared-skills-infra/tests/canonical-drift/verify.sh
      - name: Kill canonical-drift first-only mutants
        if: ${{ hashFiles('skills/shared-skills-infra/tests/canonical-drift/mutation_proof.py') != '' }}
        run: python3 skills/shared-skills-infra/tests/canonical-drift/mutation_proof.py
