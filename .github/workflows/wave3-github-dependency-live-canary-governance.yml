name: Wave3 GitHub Dependency Live Canary Governance

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - '.github/canaries/wave3-github-dependency-live-plan.json'
      - '.github/workflows/wave3-github-dependency-live-canary.yml'
      - '.github/workflows/wave3-github-dependency-live-canary-governance.yml'
      - 'skills/agentic-tech-lead-orchestration/scripts/github_issue_dag_live_canary.py'
      - 'skills/agentic-tech-lead-orchestration/references/contracts/github-dag-live-canary-receipt.schema.json'
      - 'skills/agentic-tech-lead-orchestration/tests/github_issue_dag_live_canary_selftest.py'
  push:
    branches: [main]
    paths:
      - '.github/canaries/wave3-github-dependency-live-plan.json'
      - '.github/workflows/wave3-github-dependency-live-canary.yml'
      - '.github/workflows/wave3-github-dependency-live-canary-governance.yml'
      - 'skills/agentic-tech-lead-orchestration/scripts/github_issue_dag_live_canary.py'
      - 'skills/agentic-tech-lead-orchestration/references/contracts/github-dag-live-canary-receipt.schema.json'
      - 'skills/agentic-tech-lead-orchestration/tests/github_issue_dag_live_canary_selftest.py'

permissions:
  contents: read

concurrency:
  group: wave3-github-dependency-live-canary-governance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Validate fixture plan shape
        run: python3 -m json.tool .github/canaries/wave3-github-dependency-live-plan.json >/dev/null

      - name: Prove bounded hosted canary contract
        run: python3 skills/agentic-tech-lead-orchestration/tests/github_issue_dag_live_canary_selftest.py

      - name: Compile carrier and selftest
        run: python3 -m py_compile skills/agentic-tech-lead-orchestration/scripts/github_issue_dag_live_canary.py skills/agentic-tech-lead-orchestration/tests/github_issue_dag_live_canary_selftest.py

      - name: Enforce repository commit-role provenance
        run: python3 scripts/check_commit_roles.py --repo-root .
