name: Skill Eval Physical - skill-up

on:
  workflow_dispatch:
    inputs:
      case_id:
        description: Public skill-eval/v1 case ID with a reviewed physical protocol
        required: true
        default: autoresearch-metric-loop-plan
      engine:
        description: skill-up engine
        required: true
        default: codex
      provider:
        description: model provider
        required: true
        default: openai
      model:
        description: exact model identifier
        required: true
      base_url:
        description: optional public model endpoint
        required: false
        default: ''
      current_sha:
        description: exact 40-char skills-shared commit used as current-skill baseline
        required: true

permissions:
  contents: read

concurrency:
  group: skill-eval-physical-skill-up-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  physical:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
        variant: [current_skill, candidate_skill]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: '3.12'

      - name: Validate immutable inputs and materialize skill snapshot
        id: materialize
        env:
          CURRENT_SHA: ${{ inputs.current_sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          [[ "$CURRENT_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "current_sha must be exact lowercase 40-char SHA" >&2; exit 2; }
          git cat-file -e "$CURRENT_SHA^{commit}"
          candidate_sha="$(git rev-parse HEAD)"
          root="$RUNNER_TEMP/runtime/${VARIANT}/skills/autoresearch-composer"
          mkdir -p "$root"
          if [ "$VARIANT" = current_skill ]; then
            git archive "$CURRENT_SHA" skills/autoresearch-composer | tar -x -C "$RUNNER_TEMP/runtime/${VARIANT}"
            skill_sha="$CURRENT_SHA"
          else
            cp -R skills/autoresearch-composer/. "$root/"
            skill_sha="$candidate_sha"
          fi
          echo "skill_root=$root" >> "$GITHUB_OUTPUT"
          echo "skill_sha=$skill_sha" >> "$GITHUB_OUTPUT"

      - name: Export reviewed physical protocol
        env:
          CASE_ID: ${{ inputs.case_id }}
          VARIANT: ${{ matrix.variant }}
          REPETITION: ${{ matrix.repetition }}
          SKILL_ROOT: ${{ steps.materialize.outputs.skill_root }}
          SKILL_SHA: ${{ steps.materialize.outputs.skill_sha }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/runtime/${VARIANT}/manifest-repetition-${REPETITION}.json"
          python3 scripts/export_skill_eval_runtime.py --case "$CASE_ID" --condition "$VARIANT" --skill-sha "$SKILL_SHA" \
            --engine '${{ inputs.engine }}' --provider '${{ inputs.provider }}' --model '${{ inputs.model }}' --skill-root "$SKILL_ROOT" --out "$out"
          python3 -m json.tool "$out" >/dev/null

      - name: Copy runtime root into workspace for Docker action
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          rm -rf ".physical-runtime/${VARIANT}"
          mkdir -p ".physical-runtime/${VARIANT}"
          cp -R "$RUNNER_TEMP/runtime/${VARIANT}/." ".physical-runtime/${VARIANT}/"

      - name: Execute pinned skill-up benchmark
        id: skillup
        continue-on-error: true
        uses: alibaba/skill-up@425e3f5a0c23e80f2c7933785d54c53ffe01b40c
        with:
          engine: ${{ inputs.engine }}
          model: ${{ inputs.model }}
          provider: ${{ inputs.provider }}
          api-key: ${{ secrets.SKILL_EVAL_API_KEY }}
          base-url: ${{ inputs.base_url }}
          skill-target: .physical-runtime/${{ matrix.variant }}/skills/autoresearch-composer/.runtime-eval/eval.yaml
          parallelism: '1'

      - name: Record immutable attempt identity
        if: always()
        env:
          CASE_ID: ${{ inputs.case_id }}
          VARIANT: ${{ matrix.variant }}
          REPETITION: ${{ matrix.repetition }}
          OUTCOME: ${{ steps.skillup.outcome }}
          EXIT_CODE: ${{ steps.skillup.outputs.exit-code }}
          SKILL_SHA: ${{ steps.materialize.outputs.skill_sha }}
          REPORT_DIR: ${{ steps.skillup.outputs.report-dir }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('.physical-runtime') / os.environ['VARIANT'] / 'attempt'; root.mkdir(parents=True, exist_ok=True)
          raw_exit = os.environ.get('EXIT_CODE', '')
          value = {
            'schema_version':'skill-eval-physical-attempt/v1','case_id':os.environ['CASE_ID'],'condition':os.environ['VARIANT'],
            'sampling':{'kind':'repetition','index':int(os.environ['REPETITION']),'seed':None},
            'skill_sha':os.environ['SKILL_SHA'],'eval_suite_sha':os.environ['GITHUB_SHA'],
            'harness':'skill-up','harness_sha':'425e3f5a0c23e80f2c7933785d54c53ffe01b40c',
            'engine':'${{ inputs.engine }}','provider':'${{ inputs.provider }}','model':'${{ inputs.model }}',
            'fresh_workspace':True,'max_retries':0,'action_outcome':os.environ['OUTCOME'],
            'executor_exit_code': int(raw_exit) if raw_exit.lstrip('-').isdigit() else None,
            'report_dir':os.environ.get('REPORT_DIR',''),'seed_controlled':False,'promotion_authority':False,
          }
          (root/'attempt.json').write_text(json.dumps(value,indent=2,sort_keys=True)+'\n')
          PY

      - name: Normalize report even when benchmark baseline fails
        id: normalize
        if: always()
        continue-on-error: true
        env:
          CASE_ID: ${{ inputs.case_id }}
          VARIANT: ${{ matrix.variant }}
          REPETITION: ${{ matrix.repetition }}
          SKILL_SHA: ${{ steps.materialize.outputs.skill_sha }}
          REPORT_DIR: ${{ steps.skillup.outputs.report-dir }}
        run: |
          set -euo pipefail
          test -n "$REPORT_DIR"
          test -f "$REPORT_DIR/report.json"
          attempt=".physical-runtime/${VARIANT}/attempt"
          python3 scripts/collect_skill_up_executor_evidence.py --report-dir "$REPORT_DIR" --case-id "$CASE_ID" --condition "$VARIANT" \
            --skill-sha "$SKILL_SHA" --eval-suite-sha "$GITHUB_SHA" --skill autoresearch-composer \
            --engine '${{ inputs.engine }}' --provider '${{ inputs.provider }}' --model '${{ inputs.model }}' --repetition "$REPETITION" \
            --output "$attempt/executor-evidence.json" --baseline-output "$attempt/no-skill-executor-evidence.json"
          cp "$REPORT_DIR/report.json" "$attempt/skill-up-report.json"

      - name: Replay repository deterministic verifier over with-skill artifacts
        id: deterministic
        if: steps.normalize.outcome == 'success'
        continue-on-error: true
        env:
          CASE_ID: ${{ inputs.case_id }}
          VARIANT: ${{ matrix.variant }}
          REPORT_DIR: ${{ steps.skillup.outputs.report-dir }}
        run: |
          set -euo pipefail
          attempt=".physical-runtime/${VARIANT}/attempt"
          workspace="$REPORT_DIR/$CASE_ID/with_skill/outputs/workspace"
          test -d "$workspace"
          run_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["run_id"])' "$attempt/executor-evidence.json")"
          set +e
          python3 scripts/verify_collected_runtime.py --case "$CASE_ID" --workspace "$workspace" --run-id "$run_id" --output "$attempt/verifier-receipt.json"
          verify_rc=$?
          set -e
          test -f "$attempt/verifier-receipt.json"
          python3 scripts/build_verified_run.py --executor-evidence "$attempt/executor-evidence.json" --verifier-receipt "$attempt/verifier-receipt.json" \
            --routing-evidence "$workspace/evidence/run.json" --output "$attempt/run-trace.json"
          python3 evals/adapters/build_evidence_bundle.py --run-trace "$attempt/run-trace.json" --verifier-receipt "$attempt/verifier-receipt.json" \
            --eval-suite-sha "$GITHUB_SHA" --raw-result "$attempt/skill-up-report.json" \
            --artifact "$workspace/evidence/run.json" --artifact "$workspace/artifacts/iteration-contract.json" \
            --replay-command "python3 scripts/verify_collected_runtime.py --case $CASE_ID --workspace COLLECTED_WORKSPACE --run-id $run_id --output verifier-receipt.json" \
            --output "$attempt/evidence-bundle.json"
          exit "$verify_rc"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: skill-up-${{ matrix.variant }}-repetition-${{ matrix.repetition }}-${{ github.run_attempt }}
          path: .physical-runtime/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce deterministic admission after evidence upload
        if: always()
        env:
          NORMALIZE_OUTCOME: ${{ steps.normalize.outcome || 'skipped' }}
          VERIFY_OUTCOME: ${{ steps.deterministic.outcome || 'skipped' }}
        run: |
          test "$NORMALIZE_OUTCOME" = success
          test "$VERIFY_OUTCOME" = success
