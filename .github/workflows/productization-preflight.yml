name: Productization Preflight

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
    paths:
      - 'docs/traceability/productization-operating-loop/**'
      - 'scripts/check_productization_preflight.py'
      - 'tests/test_productization_preflight.py'
      - '.github/workflows/productization-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: productization-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate Productization implementation preflight
        run: python3 scripts/check_productization_preflight.py
      - name: Run Productization preflight mutation controls
        run: python3 -m unittest tests/test_productization_preflight.py -v
