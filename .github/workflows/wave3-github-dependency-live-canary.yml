name: Wave3 GitHub Dependency Live Canary

on:
  pull_request:
    types: [ready_for_review]

permissions:
  contents: read
  issues: write

concurrency:
  group: wave3-github-dependency-live-canary
  cancel-in-progress: false

jobs:
  execute:
    if: >-
      github.repository == 'ed3c/skills-shared' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'canary/465-github-dependency-live-run' &&
      github.event.pull_request.title == '[LIVE-CANARY][#465] Execute GitHub dependency canary'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ed3c/skills-shared
      PLAN: .github/canaries/wave3-github-dependency-live-plan.json
      RECEIPT: /tmp/wave3-github-dependency-live-receipt.json
      CANARY_LABEL: wave3-live-canary-fixture
      BLOCKER_ISSUE: '486'
      BLOCKED_ISSUE: '487'
      EVIDENCE_ISSUE: '465'
      GITHUB_API_VERSION: '2026-03-10'
    steps:
      - name: Checkout exact base/main subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install pinned receipt validator
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.26.0'

      - name: Refuse stale main or unavailable dependency REST surface
        env:
          EXPECTED_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          actual_main="$(gh api "repos/${REPO}/branches/main" --jq '.commit.sha')"
          test "${actual_main}" = "${EXPECTED_BASE_SHA}"
          blocker_id="$(gh api "repos/${REPO}/issues/${BLOCKER_ISSUE}" \
            -H "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" \
            --jq '.id')"
          case "${blocker_id}" in
            ''|*[!0-9]*) echo 'blocker REST id malformed' >&2; exit 2 ;;
          esac
          test "${blocker_id}" -gt 0
          gh api "repos/${REPO}/issues/${BLOCKED_ISSUE}/dependencies/blocked_by?per_page=100" \
            -H "X-GitHub-Api-Version: ${GITHUB_API_VERSION}" >/dev/null

      - name: Bind dedicated fixture ownership label
        run: |
          set -euo pipefail
          gh label create "${CANARY_LABEL}" \
            --repo "${REPO}" \
            --color 'BFD4F2' \
            --description 'Dedicated Wave-3 reversible GitHub dependency canary fixture' \
            --force
          gh issue edit "${BLOCKER_ISSUE}" --repo "${REPO}" --add-label "${CANARY_LABEL}"
          gh issue edit "${BLOCKED_ISSUE}" --repo "${REPO}" --add-label "${CANARY_LABEL}"

      - name: Run deterministic carrier controls
        run: python3 skills/agentic-tech-lead-orchestration/tests/github_issue_dag_live_canary_selftest.py

      - name: Execute one-edge reversible remote canary
        run: |
          set -euo pipefail
          python3 skills/agentic-tech-lead-orchestration/scripts/github_issue_dag_live_canary.py \
            "${PLAN}" \
            --execute \
            --output "${RECEIPT}"

      - name: Validate exact live receipt and restored denominator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from jsonschema import Draft202012Validator

          receipt_path = Path(os.environ['RECEIPT'])
          schema_path = Path('skills/agentic-tech-lead-orchestration/references/contracts/github-dag-live-canary-receipt.schema.json')
          receipt = json.loads(receipt_path.read_text())
          schema = json.loads(schema_path.read_text())
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(receipt)
          assert receipt['repo'] == 'ed3c/skills-shared'
          assert receipt['blocker_issue'] == 486
          assert receipt['blocked_issue'] == 487
          assert receipt['before']['blockedBy'] == []
          assert receipt['applied']['blockedBy'] == [486]
          assert receipt['cleanup']['blockedBy'] == []
          assert receipt['execution'] == 'EXERCISED'
          assert receipt['canary_state'] == 'LIVE_GITHUB_DEPENDENCY_CANARY_PASS'
          assert receipt['semantic_authority'] is False
          assert receipt['evidence_ceiling'] == 'REMOTE_CANARY_EDGE_ONLY'
          PY

      - name: Publish content-bound receipt to evidence issue
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TRIGGER_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          digest="$(sha256sum "${RECEIPT}" | awk '{print $1}')"
          comment="${RUNNER_TEMP}/wave3-github-dependency-live-comment.md"
          {
            echo '## LIVE_GITHUB_DEPENDENCY_CANARY_PASS'
            echo
            echo "- workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- exact base/main SHA: \`${BASE_SHA}\`"
            echo "- trigger PR: #${TRIGGER_PR}"
            echo "- receipt sha256: \`${digest}\`"
            echo '- semantic authority: `false`'
            echo '- evidence ceiling: `REMOTE_CANARY_EDGE_ONLY`'
            echo
            echo '```json'
            cat "${RECEIPT}"
            echo '```'
          } > "${comment}"
          gh issue comment "${EVIDENCE_ISSUE}" --repo "${REPO}" --body-file "${comment}"
