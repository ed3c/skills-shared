name: Repository Portfolio Control

# One-shot hosted evidence: Draft publication does not allocate this workflow.
# The candidate is frozen locally, then marked ready exactly once. Deliberate
# omission of `synchronize` prevents GitHub Actions from becoming the edit loop.
on:
  pull_request:
    types:
      - ready_for_review
      - reopened
    paths:
      - '.github/workflows/repository-portfolio-control.yml'
      - 'skills/agentic-tech-lead-orchestration/references/REPOSITORY_PORTFOLIO_CONTROL.md'
      - 'skills/agentic-tech-lead-orchestration/references/contracts/*portfolio*.json'
      - 'skills/agentic-tech-lead-orchestration/references/contracts/issue-pr-acceptance.schema.json'
      - 'skills/agentic-tech-lead-orchestration/references/contracts/subagent-*.schema.json'
      - 'skills/agentic-tech-lead-orchestration/references/contracts/one-shot-ci-epoch.schema.json'
      - 'skills/agentic-tech-lead-orchestration/references/prompts/repository-portfolio-controller-v3.md'
      - 'skills/agentic-tech-lead-orchestration/references/codex-agents/**'
      - 'skills/agentic-tech-lead-orchestration/scripts/*portfolio*.py'
      - 'skills/agentic-tech-lead-orchestration/scripts/assert_subagent_*.py'
      - 'skills/agentic-tech-lead-orchestration/scripts/assert_one_shot_ci_epoch.py'
      - 'skills/agentic-tech-lead-orchestration/tests/portfolio-control/**'
      - 'docs/traceability/REPOSITORY_PORTFOLIO_CONTROL_C0.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/repository-portfolio-control.yml'
      - 'skills/agentic-tech-lead-orchestration/references/REPOSITORY_PORTFOLIO_CONTROL.md'
      - 'skills/agentic-tech-lead-orchestration/references/contracts/*portfolio*.json'
      - 'skills/agentic-tech-lead-orchestration/references/contracts/issue-pr-acceptance.schema.json'
      - 'skills/agentic-tech-lead-orchestration/references/contracts/subagent-*.schema.json'
      - 'skills/agentic-tech-lead-orchestration/references/contracts/one-shot-ci-epoch.schema.json'
      - 'skills/agentic-tech-lead-orchestration/references/prompts/repository-portfolio-controller-v3.md'
      - 'skills/agentic-tech-lead-orchestration/references/codex-agents/**'
      - 'skills/agentic-tech-lead-orchestration/scripts/*portfolio*.py'
      - 'skills/agentic-tech-lead-orchestration/scripts/assert_subagent_*.py'
      - 'skills/agentic-tech-lead-orchestration/scripts/assert_one_shot_ci_epoch.py'
      - 'skills/agentic-tech-lead-orchestration/tests/portfolio-control/**'
      - 'docs/traceability/REPOSITORY_PORTFOLIO_CONTROL_C0.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-portfolio-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  c0-foundation:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the pinned schema runtime
        run: python3 -m pip install --disable-pip-version-check 'jsonschema==4.23.0'
      - name: Run the complete C0 denominator
        run: bash skills/agentic-tech-lead-orchestration/tests/portfolio-control/run-all.sh
      - name: Emit the exact-head hosted receipt seed
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'schema=repository-portfolio-control-hosted-seed/v1\n'
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'sha=%s\n' "$GITHUB_SHA"
            printf 'workflow=%s\n' "$GITHUB_WORKFLOW"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'evidence_ceiling=hosted-deterministic-c0\n'
          } | tee repository-portfolio-control-hosted-seed.txt
          sha256sum repository-portfolio-control-hosted-seed.txt
